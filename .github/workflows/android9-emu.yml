name: Android 9 emulator probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emu:
    name: Boot API 28 emulator, launch app, dump logcat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Boot Android 9 (API 28) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-window-anim: true
          no-audio: true
          ram-size: 2048
          boot-timeout: 600
          emulator-flags: "-no-snapshot -gpu swiftshader_indirect"

      - name: Install, launch and dump logcat
        run: |
          set -x
          ADB="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools/adb"
          "$ADB" wait-for-device
          "$ADB" install -r -t app/build/outputs/apk/release/*.apk || true
          "$ADB" shell am force-stop me.weishu.kernelsu || true
          "$ADB" logcat -c || true
          "$ADB" shell am start -W -n me.weishu.kernelsu/.ui.MainActivity || true
          sleep 20
          "$ADB" shell am force-stop me.weishu.kernelsu || true
          sleep 2
          "$ADB" shell am start -W -n me.weishu.kernelsu/.ui.MainActivity || true
          sleep 20
          "$ADB" logcat -d -b crash -t 8000 > logcat-crash.txt || true
          "$ADB" logcat -d -t 8000 > logcat-all.txt || true
          echo "=== CRASH BUFFER ==="
          cat logcat-crash.txt
          echo "=== END CRASH BUFFER ==="

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android9-logcat
          path: logcat-*.txt
          if-no-files-found: ignore
