name: Lint API compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (NewApi detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - set up Android SDK
        uses: actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        run: ./gradlew :app:lintDebug --no-daemon || true

      - name: Dump lint findings
        run: |
          XML=$(find app/build -name "lint-results-debug.xml" | head -1)
          echo "XML=$XML"
          if [ -n "$XML" ]; then
            python3 - "$XML" <<'PY'
import sys, xml.etree.ElementTree as ET
t = ET.parse(sys.argv[1]); r = t.getroot()
for issue in r.iter('issue'):
    iid = issue.get('id','')
    print(f"[{iid}] {issue.get('severity')} | {issue.get('summary','')[:220]}")
    for c in list(issue)[:2]:
        print("    ", (c.text or '').strip()[:200])
PY
          else
            echo "no xml report"
          fi

      - name: Upload lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint-android9
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
